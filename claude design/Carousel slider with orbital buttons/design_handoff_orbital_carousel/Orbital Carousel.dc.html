<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4FC3F7&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#4FC3F7&quot;,&quot;#6EE7C8&quot;,&quot;#B79CFF&quot;,&quot;#FF9E7A&quot;],&quot;section&quot;:&quot;Style&quot;},&quot;bounce&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;trail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;sway&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  state = { now: new Date() };

  componentDidMount() {
    this._clk = setInterval(() => this.setState({ now: new Date() }), 15000);
    this._ctrls = this._ctrls || {};
    this._scan = setInterval(() => this._scanRoots(), 450);
    this._scanRoots();
  }

  componentWillUnmount() {
    clearInterval(this._clk);
    clearInterval(this._scan);
    const cs = this._ctrls || {};
    Object.keys(cs).forEach(k => cs[k].destroy());
    this._ctrls = {};
  }

  _scanRoots() {
    this._ctrls = this._ctrls || {};
    const roots = document.querySelectorAll('[data-orbit-root]');
    for (let i = 0; i < roots.length; i++) {
      const el = roots[i];
      const key = el.getAttribute('data-orbit-root');
      const prev = this._ctrls[key];
      if (prev && prev.el === el && el.isConnected) continue;
      if (prev) prev.destroy();
      this._ctrls[key] = this._make(el);
    }
  }

  renderVals() {
    const n = this.state.now;
    let h = n.getHours();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const mm = String(n.getMinutes()).padStart(2, '0');
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return {
      timeStr: h + ':' + mm + ap,
      dateStr: days[n.getDay()] + ', ' + months[n.getMonth()] + ' ' + n.getDate(),
    };
  }

  _make(el) {
    const self = this;
    const P = () => self.props || {};
    const zone = el.querySelector('[data-orbit]');
    const cvs = el.querySelector('[data-trail]');
    const ctx = cvs.getContext('2d');
    const items = Array.prototype.slice.call(el.querySelectorAll('[data-orb]'));
    const inners = items.map(it => it.querySelector('[data-orb-inner]'));
    const titleOut = el.querySelector('[data-title-out]');
    const subOut = el.querySelector('[data-sub-out]');
    const thumb = el.querySelector('[data-thumb]');
    const track = el.querySelector('[data-track]');
    const stages = [0, 1, 2, 3].map(i => el.querySelector('[data-stage="' + i + '"]'));

    const HALF = Math.PI / 2, FRONT = Math.PI / 2, TAU = Math.PI * 2;
    const CX = 201, CY = 230, RX = 152, RY = 140;
    let th = FRONT, vel = 0, phase = 'idle', target = FRONT;
    let active = 0;
    let pos = [{x:201,y:370,s:1.4},{x:49,y:230,s:1.01},{x:201,y:90,s:0.62},{x:353,y:230,s:1.01}];
    let lastT = performance.now();
    let parts = [];
    let raf = 0, dead = false, lblTO = 0;

    const norm = a => { a = a % TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
    const nearestDetent = a => Math.round(a / HALF) * HALF;

    // easter egg: rapid-spin tracking
    const EGG_WINDOW = 4000, EGG_REVS = 7;
    const WITTY = ['having fun are we?', 'okay speed demon.', 'someone is bored.', 'round and round we go.', 'dizzy yet?', 'the dial appreciates the workout.', 'not letting go, huh?', 'we see you.'];
    let rotBuf = [], turboActive = false, turboEnd = 0, turboPhraseIdx = 0, turboPhraseT = 0;
    function addRot(d) {
      const now = performance.now();
      rotBuf.push({ t: now, d: Math.abs(d) });
      while (rotBuf.length && now - rotBuf[0].t > EGG_WINDOW) rotBuf.shift();
    }
    function revsInWindow() {
      let s = 0;
      for (let i = 0; i < rotBuf.length; i++) s += rotBuf[i].d;
      return s / TAU;
    }

    function measure() {
      const r = zone.getBoundingClientRect();
      cvs.width = Math.max(1, Math.round(r.width));
      cvs.height = Math.max(1, Math.round(r.height));
    }
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(zone);

    const accent = () => P().accent || '#4FC3F7';
    function rgb() {
      const x = accent().replace('#', '');
      return [parseInt(x.substr(0, 2), 16), parseInt(x.substr(2, 2), 16), parseInt(x.substr(4, 2), 16)];
    }

    function spawn(x, y, n, spd) {
      if (P().trail === false) return;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU, s = (spd || 30) * (0.3 + Math.random());
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, max: 0.9, r: 1.5 + Math.random() * 2.5 });
      }
      if (parts.length > 260) parts.splice(0, parts.length - 260);
    }

    function popEl(n) {
      if (n && n.animate) n.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.16)' }, { transform: 'scale(1)' }],
        { duration: 300, easing: 'cubic-bezier(.34,1.8,.64,1)' }
      );
    }

    function updateStage(i) {
      for (let k = 0; k < stages.length; k++) {
        if (!stages[k]) continue;
        stages[k].style.display = 'none';
      }
      if (stages[i]) stages[i].style.display = i === 2 ? 'flex' : (i === 0 ? 'flex' : (i === 1 ? 'flex' : 'block'));
    }

    function refreshLabel() {
      const it = items[active];
      titleOut.style.opacity = '1';
      subOut.style.opacity = '1';
      titleOut.textContent = it.getAttribute('data-title');
      subOut.textContent = it.getAttribute('data-sub');
    }

    function setActive(i) {
      if (i === active) {
        return;
      }
      active = i;
      updateStage(i);
      if (turboActive) return;
      const it = items[i];
      titleOut.style.opacity = '0';
      subOut.style.opacity = '0';
      clearTimeout(lblTO);
      lblTO = setTimeout(() => {
        titleOut.textContent = it.getAttribute('data-title');
        subOut.textContent = it.getAttribute('data-sub');
        titleOut.style.opacity = '1';
        subOut.style.opacity = '1';
      }, 130);
    }

    function spinTo(i) {
      const want = FRONT - i * HALF;
      target = th + norm(want - th);
      if (Math.abs(target - th) < 0.001) { popEl(inners[i]); return; }
      phase = 'spring';
    }

    function tap(p) {
      for (let i = 0; i < 4; i++) {
        const q = pos[i];
        if (Math.hypot(p.x - q.x, p.y - q.y) < 34 * q.s + 10) { spinTo(i); return; }
      }
    }

    function onSettle() {
      popEl(inners[active]);
      const q = pos[active];
      spawn(q.x, q.y, 14, 85);
    }

    let pid = null, pStart = null, pLast = null, moved = 0, samples = [], dragging = false, downT = 0;
    const posOf = e => { const r = zone.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

    function down(e, drag) {
      if (pid !== null) return;
      pid = e.pointerId;
      try { e.currentTarget.setPointerCapture(pid); } catch (err) {}
      pStart = pLast = posOf(e);
      moved = 0; downT = performance.now(); samples = [];
      dragging = drag;
      if (drag) {
        phase = 'drag'; vel = 0;
        if (turboActive) { turboActive = false; rotBuf = []; }
      }
    }
    function move(e) {
      if (e.pointerId !== pid) return;
      const p = posOf(e);
      moved += Math.hypot(p.x - pLast.x, p.y - pLast.y);
      if (dragging) {
        const da = -(p.x - pLast.x) * 0.016;
        th += da;
        addRot(da);
        samples.push({ t: performance.now(), th: th });
        if (samples.length > 8) samples.shift();
        if (Math.abs(da) > 0.002) spawn(pos[active].x, pos[active].y, 2, 40);
      }
      pLast = p;
    }
    function up(e) {
      if (e.pointerId !== pid) return;
      pid = null;
      const dt = performance.now() - downT;
      if (moved < 8 && dt < 450 && pStart) tap(pStart);
      if (dragging) {
        dragging = false;
        let v = 0;
        if (samples.length > 1) {
          const a = samples[0], b = samples[samples.length - 1];
          const ddt = (b.t - a.t) / 1000;
          if (ddt > 0.005) v = (b.th - a.th) / ddt;
        }
        vel = Math.max(-14, Math.min(14, v));
        if (Math.abs(vel) > 1.6) phase = 'fling';
        else { target = nearestDetent(th + vel * 0.12); phase = 'spring'; }
      }
    }

    track.addEventListener('pointerdown', e => { down(e, true); e.stopPropagation(); });
    zone.addEventListener('pointerdown', e => down(e, false));
    [zone, track].forEach(s => {
      s.addEventListener('pointermove', move);
      s.addEventListener('pointerup', up);
      s.addEventListener('pointercancel', up);
    });

    function layout(a0) {
      const c = rgb();
      for (let i = 0; i < 4; i++) {
        const a = a0 + i * HALF;
        const x = CX + RX * Math.cos(a);
        const y = CY + RY * Math.sin(a);
        const d = (Math.sin(a) + 1) / 2;
        const s = 0.58 + 1.12 * d;
        pos[i] = { x: x, y: y, s: s };
        items[i].style.transform = 'translate(' + (x - 32) + 'px, ' + (y - 32) + 'px) scale(' + s.toFixed(3) + ')';
        items[i].style.opacity = (0.38 + 0.62 * d).toFixed(3);
        items[i].style.zIndex = String(1 + Math.round(d * 40));
        if (d > 0.86) {
          const g = Math.round(36 * (d - 0.86) / 0.14);
          inners[i].style.boxShadow = '0 0 ' + g + 'px rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.45), 0 8px 24px rgba(0,0,0,0.5)';
          inners[i].style.borderColor = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.5)';
        } else {
          inners[i].style.boxShadow = '0 8px 24px rgba(0,0,0,0.5)';
          inners[i].style.borderColor = 'rgba(126,168,188,0.18)';
        }
      }
    }

    function updateThumb() {
      if (!thumb) return;
      const c = rgb();
      const off = norm(th - nearestDetent(th));
      const p = Math.max(0, Math.min(1, 0.5 - off * 2 / Math.PI));
      const tw = track.clientWidth - 46;
      const sx = 1 + Math.min(1.1, Math.abs(vel) * 0.16);
      const sy = 1 / Math.sqrt(sx);
      thumb.style.transform = 'translate(' + (4 + p * tw).toFixed(1) + 'px, 0) scale(' + sx.toFixed(3) + ', ' + sy.toFixed(3) + ')';
      thumb.style.background = 'radial-gradient(circle at 35% 30%, #d9f3ff 0%, ' + accent() + ' 45%, #1d6fa8 100%)';
      thumb.style.boxShadow = '0 0 22px rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.55)';
    }

    function drawParts(dt) {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      if (!parts.length) return;
      const c = rgb();
      ctx.globalCompositeOperation = 'lighter';
      parts = parts.filter(pt => {
        pt.life -= dt;
        if (pt.life <= 0) return false;
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vx *= 0.96; pt.vy *= 0.96;
        const al = Math.max(0, pt.life / pt.max);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (al * 0.55).toFixed(3) + ')';
        ctx.arc(pt.x, pt.y, pt.r * (0.5 + al), 0, TAU);
        ctx.fill();
        return true;
      });
      ctx.globalCompositeOperation = 'source-over';
    }

    function tick(now) {
      if (dead) return;
      raf = requestAnimationFrame(tick);
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;

      if (phase === 'fling') {
        const d = vel * dt;
        th += d;
        addRot(d);
        vel *= Math.exp(-2.6 * dt);
        if (!turboActive && revsInWindow() >= EGG_REVS) {
          turboActive = true;
          turboEnd = now + 3200 + Math.random() * 900;
          vel = Math.sign(vel || 1) * Math.max(20, Math.abs(vel) * 1.35);
          phase = 'turbo';
          turboPhraseT = 0.9;
          titleOut.style.opacity = '1'; subOut.style.opacity = '1';
          titleOut.textContent = '🌀';
        } else if (Math.abs(vel) < 1.6) {
          target = nearestDetent(th + vel * 0.12); phase = 'spring';
        }
      } else if (phase === 'turbo') {
        const d = vel * dt;
        th += d;
        vel *= Math.exp(-0.5 * dt);
        turboPhraseT += dt;
        if (turboPhraseT > 0.85) {
          turboPhraseT = 0;
          subOut.textContent = WITTY[turboPhraseIdx % WITTY.length];
          turboPhraseIdx++;
        }
        spawn(pos[active].x, pos[active].y, 3, 70);
        if (now > turboEnd || Math.abs(vel) < 3) {
          turboActive = false;
          rotBuf = [];
          target = nearestDetent(th);
          phase = 'spring';
        }
      } else if (phase === 'spring') {
        const b = P().bounce == null ? 0.6 : P().bounce;
        const k = 130, cd = 2 * Math.sqrt(k) * (1.05 - 0.62 * b);
        vel += (k * (target - th) - cd * vel) * dt;
        th += vel * dt;
        if (Math.abs(target - th) < 0.004 && Math.abs(vel) < 0.06) {
          th = target; vel = 0; phase = 'idle';
          refreshLabel();
          onSettle();
        }
      }

      const swayOn = P().sway !== false;
      const disp = th + (phase === 'idle' && swayOn ? Math.sin(now / 850) * 0.026 : 0);
      layout(disp);

      const ai = ((Math.round((FRONT - th) / HALF) % 4) + 4) % 4;
      if (ai !== active) setActive(ai);

      updateThumb();
      drawParts(dt);
    }
    raf = requestAnimationFrame(tick);
    updateStage(0);

    return {
      el: el,
      destroy: function () {
        dead = true;
        cancelAnimationFrame(raf);
        clearTimeout(lblTO);
        ro.disconnect();
      }
    };
  }
}
</script>
</body>
</html>
