<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;background:#050505;}
a{color:var(--accent,#7E93A6);text-decoration:none;}
a:hover{color:#f4f4f4;}
*::-webkit-scrollbar{width:0;height:0;display:none;}
*{scrollbar-width:none;}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoBoxGlow{0%,100%{box-shadow:0 0 18px color-mix(in srgb,var(--accent,#7E93A6) 28%,transparent)}50%{box-shadow:0 0 0 rgba(0,0,0,0)}}
@keyframes logoMarkGlow{0%,100%{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent,#7E93A6) 45%,transparent))}50%{filter:drop-shadow(0 0 1px transparent)}}
@keyframes labelGive{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes colorBleed{0%,100%{background-position:100% 0}50%{background-position:0% 0}}
</style>
</helmet>

<div style="--accent: {{ accent }}; min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #0b0b0b 0%, #050505 55%); font-family:'Space Grotesk',system-ui,sans-serif; padding:36px 20px; position:relative; overflow:hidden;">

  <div style="position:absolute; top:-12%; left:50%; transform:translateX(-50%); width:680px; height:620px; background:radial-gradient(circle, color-mix(in srgb, var(--accent,#A3E635) 13%, transparent), transparent 62%); filter:blur(30px); pointer-events:none;"></div>

  <div style="position:relative; width:392px; height:846px; background:radial-gradient(140% 120% at 50% 30%, #07090b 0%, #030405 55%, #000000 100%); border-radius:56px; border:1px solid #232323; box-shadow:0 50px 130px rgba(0,0,0,.75), inset 0 0 0 8px #090909, inset 0 0 80px rgba(0,0,0,.8); overflow:hidden; z-index:1; display:flex; flex-direction:column;">

    <!-- STATUS BAR -->
    <div style="flex:none; height:54px; display:flex; align-items:center; justify-content:space-between; padding:20px 34px 0; position:relative; z-index:8;">
      <span style="font:600 15px 'Space Grotesk'; color:#fff; letter-spacing:.3px;">9:41</span>
      <div style="position:absolute; left:50%; top:13px; transform:translateX(-50%); width:104px; height:30px; background:#000; border-radius:16px;"></div>
      <div style="display:flex; gap:7px; align-items:center; color:#fff;">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.6c2.3 0 4.4.9 6 2.4l1.4-1.5C13.9 1.5 11.3.5 8.5.5S3.1 1.5 1.1 3.5L2.5 5c1.6-1.5 3.7-2.4 6-2.4z"/><path d="M8.5 6.2c1.3 0 2.5.5 3.4 1.4l1.4-1.5C12 4.8 10.3 4.1 8.5 4.1S5 4.8 3.7 6.1l1.4 1.5c.9-.9 2.1-1.4 3.4-1.4z"/><circle cx="8.5" cy="10" r="1.6"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.6" height="5" rx="0.8" fill="currentColor" opacity=".5"/></svg>
      </div>
    </div>

    <!-- BODY -->
    <div style="flex:1; position:relative; overflow:hidden;">

      <!-- ===== HOME ===== -->
      <div style="position:absolute; inset:0; overflow-y:auto; padding:8px 24px 28px; animation:screenIn .34s ease both;">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0 4px;">
          <div style="display:flex; align-items:center; gap:11px;">
            <div style="width:34px; height:34px; border-radius:11px; background:#0d0d0d; border:1px solid #232323; display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px color-mix(in srgb,var(--accent,#7E93A6) 28%,transparent); animation:logoBoxGlow 6s ease-in-out infinite;">
              <span style="display:flex; filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent,#7E93A6) 45%,transparent)); animation:logoMarkGlow 6s ease-in-out infinite;">{{ logoMark }}</span>
            </div>
            <span style="font:600 18px 'Space Grotesk'; color:#f4f4f4; letter-spacing:-.2px;">Control</span>
          </div>
          <sc-if value="{{ showFreeBadge }}" hint-placeholder-val="{{ true }}">
            <span style="font:500 11px 'JetBrains Mono'; color:#6a6a6a; border:1px solid #1e1e1e; padding:5px 9px; border-radius:8px;">{{ freeText }}</span>
          </sc-if>
        </div>

        <div style="margin-top:54px;">
          <div style="font:500 13px 'JetBrains Mono'; color:var(--accent,#7E93A6); letter-spacing:1.5px; text-transform:uppercase; animation:labelGive 14s ease-in-out infinite;">Drop it in</div>
          <h1 style="font:600 33px/1.12 'Space Grotesk'; margin:14px 0 0; letter-spacing:-.8px; text-wrap:balance; background:linear-gradient(120deg, #f6f6f6 0%, #f6f6f6 32%, var(--accent,#7E93A6) 50%, #f6f6f6 68%, #f6f6f6 100%); background-size:280% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:colorBleed 14s ease-in-out infinite;">What needs<br>handling?</h1>
          <p style="font:400 14px/1.5 'Space Grotesk'; color:#7a7a7a; margin:14px 0 0; max-width:320px; min-height:42px;">{{ rotatingMsg }}<span style="display:inline-block; width:2px; height:15px; background:var(--accent,#A3E635); margin-left:2px; vertical-align:-2px; opacity:{{ caretOpacity }};"></span></p>
        </div>

        <div style="margin-top:24px; background:radial-gradient(140% 120% at 50% 30%, #07090b 0%, #030405 55%, #000000 100%); border:1px solid #101317; border-radius:18px; padding:22px 18px 14px; box-shadow:inset 0 0 40px rgba(0,0,0,.8), 0 8px 30px rgba(0,0,0,.5);">
          <textarea value="{{ inputValue }}" onChange="{{ onInput }}" placeholder="Add daughter to insurance…" rows="2" style="width:100%; resize:none; border:none; outline:none; background:transparent; color:#eef2f6; font:500 18px/1.5 'Space Grotesk'; caret-color:var(--accent,#7E93A6); min-height:64px; text-shadow:0 0 14px rgba(190,208,222,.28);"></textarea>
          <div style="display:flex; justify-content:flex-end;">
            <button style="display:flex; align-items:center; gap:8px; border:1px solid #262626; cursor:pointer; background:radial-gradient(135% 105% at 50% -8%, #242424 0%, #181818 38%, #111111 72%, #0d0d0d 100%); color:#e8ecf0; font:600 15px 'Space Grotesk'; padding:11px 18px; border-radius:12px; box-shadow:0 6px 22px rgba(0,0,0,.5);">
              Break it down
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8 4l4 4-4 4" stroke="#e8ecf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div style="margin-top:26px;">
          <div style="font:500 11px 'JetBrains Mono'; color:#5a5a5a; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:12px;">Or try one</div>
          <div style="display:flex; flex-direction:column; gap:9px;">
            <sc-for list="{{ examples }}" as="ex" hint-placeholder-count="4">
              <button onClick="{{ ex.onPick }}" style="display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; cursor:pointer; background:radial-gradient(135% 105% at 50% -8%, #242424 0%, #181818 38%, #111111 72%, #0d0d0d 100%); border:1px solid #222; border-radius:13px; padding:14px 15px; color:#cfcfcf; font:500 15px 'Space Grotesk';">
                {{ ex.label }}
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#4a4a4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </sc-for>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:920},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7E93A6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;1a&quot;,&quot;options&quot;:[&quot;1a&quot;,&quot;1b&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Branding&quot;},&quot;showFreeBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    // Placeholder copy — swap for Obsy's mood content.
    this.EXAMPLES = ['Add daughter to insurance','Plan wife\u2019s birthday gift','Fix car registration issue','Schedule doctor appointment'];
    this.MESSAGES = [
      'Type the messy thing. Control asks a few questions, then breaks it into a clear plan.',
      'Plan Sunday dinner \u2014 Control turns the recipe into a grocery list and a prep order.',
      'Sort out the bill you\u2019ve been avoiding. Control maps the calls, forms, and deadlines.',
      'Finally start that hobby. Control breaks the gear, budget, and first steps into a plan.',
      'Pull off the weekend trip. Control handles bookings, packing, and who needs to know.',
    ];
    this.state = { inputValue:'', typed:this.MESSAGES[0], caretOn:true };
  }

  onInput = (e)=> this.setState({inputValue:e.target.value});
  pickExample = (t)=> this.setState({inputValue:t});

  componentWillUnmount(){ clearTimeout(this._twT); clearInterval(this._caretT); }
  componentDidMount(){
    // blinking caret + rotating hero subline (typewriter)
    this._caretT = setInterval(()=>this.setState(s=>({caretOn:!s.caretOn})), 480);
    this.tw = { mi:0, ci:this.MESSAGES[0].length, phase:'hold' };
    this._twT = setTimeout(()=>this.twStep(), 5000);
  }
  twStep(){
    const msgs = this.MESSAGES;
    let { mi, ci, phase } = this.tw;
    let delay = 38;
    if(phase==='typing'){
      ci++;
      if(ci >= msgs[mi].length){ ci = msgs[mi].length; phase='hold'; delay=5000; }
      else { delay = 30 + Math.random()*45; }
    } else if(phase==='hold'){
      phase='deleting'; delay=24;
    } else {
      ci--;
      if(ci <= 0){ ci=0; mi=(mi+1)%msgs.length; phase='typing'; delay=180; }
      else { delay=16; }
    }
    this.tw = { mi, ci, phase };
    this.setState({ typed: msgs[mi].slice(0, ci) });
    this._twT = setTimeout(()=>this.twStep(), delay);
  }

  // ---- logo mark (dreamy blue-grey crescent) — replace with Obsy's mark ----
  circ3(p1,p2,p3){
    const ax=p1[0],ay=p1[1],bx=p2[0],by=p2[1],cx=p3[0],cy=p3[1];
    const d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
    const ux=((ax*ax+ay*ay)*(by-cy)+(bx*bx+by*by)*(cy-ay)+(cx*cx+cy*cy)*(ay-by))/d;
    const uy=((ax*ax+ay*ay)*(cx-bx)+(bx*bx+by*by)*(ax-cx)+(cx*cx+cy*cy)*(bx-ax))/d;
    return {r:Math.hypot(ax-ux,ay-uy)};
  }
  crescent(RO, aT, aB, t){
    const rd=d=>d*Math.PI/180, f=n=>n.toFixed(1);
    const T=[200+RO*Math.cos(rd(aT)),200-RO*Math.sin(rd(aT))];
    const B=[200+RO*Math.cos(rd(aB)),200+RO*Math.sin(rd(aB))];
    const c=this.circ3(T,B,[200-RO+t,200]);
    return 'M'+f(T[0])+' '+f(T[1])+' A'+RO+' '+RO+' 0 1 0 '+f(B[0])+' '+f(B[1])+
           ' A'+f(c.r)+' '+f(c.r)+' 0 1 1 '+f(T[0])+' '+f(T[1])+' Z';
  }
  buildLogo(v){
    const e=React.createElement;
    const light=e('radialGradient',{key:'lg',id:'clogo-l',gradientUnits:'userSpaceOnUse',cx:170,cy:150,r:230},[
      e('stop',{key:0,offset:'0%',stopColor:'#d5e0e9'}),
      e('stop',{key:1,offset:'48%',stopColor:'#aebfcd'}),
      e('stop',{key:2,offset:'100%',stopColor:'#7e93a6'}),
    ]);
    const darkg=e('radialGradient',{key:'dg',id:'clogo-d',gradientUnits:'userSpaceOnUse',cx:170,cy:150,r:230},[
      e('stop',{key:0,offset:'0%',stopColor:'#8fa2b2'}),
      e('stop',{key:1,offset:'52%',stopColor:'#617484'}),
      e('stop',{key:2,offset:'100%',stopColor:'#42525f'}),
    ]);
    const shapes=[];
    if(v==='1a'){
      shapes.push(e('path',{key:'o',d:this.crescent(130,54,24,15),fill:'url(#clogo-l)'}));
      shapes.push(e('path',{key:'i',d:this.crescent(86,24,54,12),fill:'url(#clogo-l)'}));
    } else {
      shapes.push(e('path',{key:'o',d:this.crescent(130,38,38,20),fill:'url(#clogo-d)',stroke:'#ffffff',strokeWidth:6,strokeLinejoin:'round'}));
    }
    return e('svg',{viewBox:'0 0 400 400',width:24,height:24,style:{display:'block',overflow:'visible'}},[
      e('defs',{key:'d'},[light,darkg]),
      e('rect',{key:'bar',x:22,y:193,width:330,height:14,rx:7,fill:v==='1a'?'url(#clogo-l)':'url(#clogo-d)',
        stroke:v==='1b'?'#ffffff':'none',strokeWidth:v==='1b'?3:0}),
      e('g',{key:'t',transform:'rotate(-8 200 200)'},shapes),
    ]);
  }

  renderVals(){
    const accent = this.props.accent ?? '#7E93A6';
    const showFreeBadge = this.props.showFreeBadge ?? true;
    const s = this.state;
    return {
      accent, showFreeBadge,
      logoMark: this.buildLogo(this.props.logo ?? '1a'),
      freeText: '3 of 3 free',
      inputValue:s.inputValue, onInput:this.onInput,
      rotatingMsg:s.typed, caretOpacity:s.caretOn?1:0.15,
      examples:this.EXAMPLES.map(label=>({label, onPick:()=>this.pickExample(label)})),
    };
  }
}
</script>
</body>
</html>
